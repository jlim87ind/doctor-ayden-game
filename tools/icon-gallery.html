<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Icon gallery</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: #fffdf5;
        font:
          12px/1.3 system-ui,
          sans-serif;
        color: #33443d;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 12px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 10px;
      }
      .cell {
        background: #eff7f3;
        border: 1px solid #cfe3d8;
        border-radius: 10px;
        padding: 8px;
        text-align: center;
      }
      .row {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: 8px;
        min-height: 66px;
      }
      .name {
        margin-top: 4px;
        font-weight: 600;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <h1>Doctor Ayden icons (top: SVG, bottom: canvas) at 20 / 32 / 64 px</h1>
    <div class="grid" id="grid"></div>
    <script type="module">
      import { ICONS, iconSVG, drawIcon } from '../icons.js';
      const sizes = [20, 32, 64];
      const dpr = window.devicePixelRatio || 1;
      const grid = document.getElementById('grid');
      for (const name of Object.keys(ICONS)) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        const svgRow = document.createElement('div');
        svgRow.className = 'row';
        svgRow.innerHTML = sizes.map((s) => iconSVG(name, { size: s, label: name })).join('');
        const canRow = document.createElement('div');
        canRow.className = 'row';
        for (const s of sizes) {
          const c = document.createElement('canvas');
          c.width = s * dpr;
          c.height = s * dpr;
          c.style.width = c.style.height = s + 'px';
          const ctx = c.getContext('2d');
          ctx.scale(dpr, dpr);
          drawIcon(ctx, name, s / 2, s / 2, s);
          canRow.append(c);
        }
        const label = document.createElement('div');
        label.className = 'name';
        label.textContent = name;
        cell.append(svgRow, canRow, label);
        grid.append(cell);
      }
      document.body.dataset.ready = '1';
    </script>
  </body>
</html>
