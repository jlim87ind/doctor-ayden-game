<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eff8f4">
  <title>Doctor Ayden to the Rescue!</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="brandbar"><a href="#" id="home" aria-label="Doctor Ayden home"><span class="brandmark">✚</span><span>doctor <b>ayden</b><small>LITTLE HANDS. BIG HEART.</small></span></a><div class="header-right"><span class="kindness">A little care goes a long way ♡</span><button id="sound" class="icon-button" aria-label="Mute sound" title="Sound on / off">♫</button><button id="settings" class="icon-button" aria-label="Settings" title="Settings">⚙</button></div></header>
  <main id="app">
    <div id="hud" hidden></div>
    <div id="game-wrap"><canvas id="world" width="1200" height="760" aria-label="Hospital. Use arrow keys or WASD to walk. Press E to interact. Or tap a patient or room to walk there."></canvas><div id="world-buttons"></div><div id="game-overlay"></div></div>
    <div id="bottom" hidden></div>
    <div id="screen"></div>
  </main>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
  <div id="touch-controls" hidden><div id="joystick" aria-label="Movement joystick"><span></span></div><button id="touch-interact" aria-label="Interact">✋<small>Help</small></button></div>
  <footer><span>Made for small doctors with very big hearts.</span><button id="credits">Grown-ups & credits</button></footer>
  <script type="module" src="app.js"></script>
</body>
</html>
